server:
  port: ${SERVER_PORT:15432}
  tomcat:
    socket:
      so-linger: -1


spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:hot_topics}
    username: ${PG_USERNAME:root}
    password: ${PG_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: crudclass-pg-mcp-server
        version: 1.0.0
        type: SYNC
        instructions: "PostgreSQL CRUD MCP 服务 — 支持建表、删表、增删改查，写操作需二次确认"
        resource-change-notification: true
        tool-change-notification: true
        prompt-change-notification: true
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /api/mcp
          keep-alive-interval: 30s

crudclass:
  mcp:
    tool-locale: ${TOOL_LOCALE:zh}
